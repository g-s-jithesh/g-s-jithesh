<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="100%" height="100%">
  <defs>
    <!-- Deep space & midnight slate background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060911" />
      <stop offset="45%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Glowing Aurora Gradients -->
    <radialGradient id="glowCyan" cx="20%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.16" />
      <stop offset="60%" stop-color="#4facfe" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowPurple" cx="82%" cy="65%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.18" />
      <stop offset="55%" stop-color="#6366f1" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="55%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#30363d" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.5" />
    </linearGradient>

    <!-- Subtle Cyber Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.6" stroke-opacity="0.035" />
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.12" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
    
    @keyframes pulseSlow {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 0.85; transform: scale(1.03); }
    }
    @keyframes floatCube {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    @keyframes dashFlow {
      to { stroke-dashoffset: -40; }
    }
    .cursor { animation: blink 1.1s infinite; }
    .floating { animation: floatCube 5s ease-in-out infinite; }
    .flow-line { stroke-dasharray: 6 6; animation: dashFlow 2.5s linear infinite; }
    .pulse-dot { animation: pulseSlow 3s ease-in-out infinite; }
  </style>

  <!-- Main Card Background -->
  <rect width="996" height="316" x="2" y="2" rx="18" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />
  <rect width="996" height="316" x="2" y="2" rx="18" fill="url(#grid)" />
  <rect width="996" height="316" x="2" y="2" rx="18" fill="url(#glowCyan)" />
  <rect width="996" height="316" x="2" y="2" rx="18" fill="url(#glowPurple)" />

  <!-- Top Terminal Chrome Bar -->
  <g transform="translate(36, 26)">
    <circle cx="8" cy="8" r="5.5" fill="#ff5f56" />
    <circle cx="26" cy="8" r="5.5" fill="#ffbd2e" />
    <circle cx="44" cy="8" r="5.5" fill="#27c93f" />
    <text x="68" y="12" class="font-mono" font-size="12" fill="#8b949e" letter-spacing="0.5">jithesh@srmist:~/workspace/systems-and-ai — zsh</text>

    <!-- Status Pill Right -->
    <g transform="translate(725, -4)">
      <rect width="200" height="24" rx="12" fill="#111827" stroke="#1f2937" stroke-width="1" />
      <circle cx="14" cy="12" r="4" fill="#10b981" class="pulse-dot" />
      <text x="26" y="16" class="font-mono" font-size="11" fill="#10b981" font-weight="600">OPEN TO OPPORTUNITIES</text>
    </g>
  </g>

  <line x1="2" y1="54" x2="998" y2="54" stroke="#30363d" stroke-width="1" stroke-opacity="0.5" />

  <!-- Left Content Column -->
  <g transform="translate(44, 92)">
    <!-- Terminal Prompt Intro -->
    <text x="0" y="0" class="font-mono" font-size="13" fill="#38bdf8" font-weight="600">
      <tspan fill="#a855f7">❯</tspan> whoami --verbose
    </text>

    <!-- Main Name Header -->
    <text x="0" y="44" class="font-sans" font-size="38" font-weight="800" fill="url(#titleGrad)" letter-spacing="-0.8">
      GOPALAN SRINIVASAN JITHESH
    </text>

    <!-- Role Subtitle with Gradient Accent -->
    <text x="0" y="76" class="font-mono" font-size="15.5" font-weight="600" fill="url(#accentGrad)">
      AI Agents (MCP)  •  3D Desktop Tools  •  Full-Stack &amp; Distributed Systems
    </text>

    <!-- Bio Summary Line -->
    <text x="0" y="108" class="font-sans" font-size="14" fill="#9ca3af">
      Final-year CSE (AI &amp; ML) @ SRMIST ('27) shipping end-to-end software: native desktop apps with CI/CD
    </text>
    <text x="0" y="128" class="font-sans" font-size="14" fill="#9ca3af">
      installers, autonomous MCP voice/vision agents, and high-throughput microservices.<tspan class="cursor" fill="#38bdf8" font-weight="bold"> █</tspan>
    </text>

    <!-- Metric Badges Row -->
    <g transform="translate(0, 152)">
      <!-- Badge 1: Commits & PRs -->
      <rect x="0" y="0" width="188" height="32" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <text x="12" y="20" class="font-mono" font-size="12" fill="#e6edf3">
        <tspan fill="#38bdf8" font-weight="bold">⚡ 43+</tspan> Merged PRs (2026)
      </text>

      <!-- Badge 2: MCP SDK Contributor -->
      <rect x="198" y="0" width="232" height="32" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <text x="210" y="20" class="font-mono" font-size="12" fill="#e6edf3">
        <tspan fill="#a855f7" font-weight="bold">🧩 MCP SDK</tspan> Upstream Fix #3725
      </text>

      <!-- Badge 3: Blendex Releases -->
      <rect x="440" y="0" width="195" height="32" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1" />
      <text x="452" y="20" class="font-mono" font-size="12" fill="#e6edf3">
        <tspan fill="#10b981" font-weight="bold">🚀 6 Releases</tspan> on Blendex
      </text>
    </g>
  </g>

  <!-- Right Graphic: 3D Wireframe Cube + Neural Node Constellation (Representing Blendex 3D + AI/MCP) -->
  <g transform="translate(795, 175)" class="floating">
    <!-- Outer Orbit Ring -->
    <ellipse cx="0" cy="0" rx="115" ry="42" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.25" transform="rotate(-22)" />
    <ellipse cx="0" cy="0" rx="115" ry="42" fill="none" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.4" class="flow-line" transform="rotate(28)" />

    <!-- Isometric 3D Cube (Blendex + Systems Engineering Symbol) -->
    <!-- Back Faces -->
    <polygon points="0,-62 54,-31 54,31 0,62 -54,31 -54,-31" fill="#0d1117" fill-opacity="0.7" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.45" />
    <!-- Top Face -->
    <polygon points="0,-62 54,-31 0,0 -54,-31" fill="#38bdf8" fill-opacity="0.12" stroke="#38bdf8" stroke-width="1.6" />
    <!-- Left Face -->
    <polygon points="-54,-31 0,0 0,62 -54,31" fill="#6366f1" fill-opacity="0.12" stroke="#818cf8" stroke-width="1.6" />
    <!-- Right Face -->
    <polygon points="54,-31 0,0 0,62 54,31" fill="#a855f7" fill-opacity="0.12" stroke="#c084fc" stroke-width="1.6" />

    <!-- Inner Core Cube -->
    <polygon points="0,-28 24,-14 24,14 0,28 -24,14 -24,-14" fill="url(#accentGrad)" fill-opacity="0.35" stroke="#ffffff" stroke-width="1" stroke-opacity="0.8" />

    <!-- Glowing Vertex Nodes -->
    <circle cx="0" cy="-62" r="3.5" fill="#38bdf8" filter="url(#neonGlow)" />
    <circle cx="54" cy="-31" r="3.5" fill="#818cf8" filter="url(#neonGlow)" />
    <circle cx="54" cy="31" r="3.5" fill="#c084fc" filter="url(#neonGlow)" />
    <circle cx="0" cy="62" r="3.5" fill="#a855f7" filter="url(#neonGlow)" />
    <circle cx="-54" cy="31" r="3.5" fill="#38bdf8" filter="url(#neonGlow)" />
    <circle cx="-54" cy="-31" r="3.5" fill="#38bdf8" filter="url(#neonGlow)" />
    <circle cx="0" cy="0" r="4.5" fill="#ffffff" filter="url(#neonGlow)" />

    <!-- Floating Telemetry Labels -->
    <g transform="translate(66, -54)">
      <rect width="68" height="20" rx="4" fill="#0d1117" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.6" />
      <text x="8" y="13.5" class="font-mono" font-size="9.5" fill="#38bdf8">3D / GLB</text>
    </g>
    <g transform="translate(-128, 36)">
      <rect width="68" height="20" rx="4" fill="#0d1117" stroke="#c084fc" stroke-width="0.8" stroke-opacity="0.6" />
      <text x="8" y="13.5" class="font-mono" font-size="9.5" fill="#c084fc">MCP / AI</text>
    </g>
    <g transform="translate(52, 48)">
      <rect width="76" height="20" rx="4" fill="#0d1117" stroke="#10b981" stroke-width="0.8" stroke-opacity="0.6" />
      <text x="8" y="13.5" class="font-mono" font-size="9.5" fill="#10b981">SYS / GO</text>
    </g>
  </g>
</svg>
